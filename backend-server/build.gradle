plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.smu.just4team'
version = '0.0.1-SNAPSHOT'
description = 'backend-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' } // Repositorio de Spring
    maven { url 'https://repo.spring.io/snapshot' }  // Repositorio de Snapshots de Spring
    maven { url 'https://repo.eclipse.org/content/repositories/releases/' } // Eclipse Repo para JSTL
}

//ext {
//    set('springAiVersion', "2.0.0-M3")
//}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
//    implementation 'org.springframework.boot:spring-boot-starter-web'
//    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper:11.0.22'
//    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Spring Boot 4.x / Tomcat 11은 jakarta namespace 사용. 옛 javax.servlet:jstl:1.2 사용 시
    // ClassNotFoundException: javax.servlet.jsp.tagext.TagLibraryValidator 발생.
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.2'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    compileOnly 'org.projectlombok:lombok'
//    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    
//    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat-runtime'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
//    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

//dependencyManagement {
//    imports {
//        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
//    }
//}

tasks.named('test') {
    useJUnitPlatform()
}

