spring.application.name=backend-server
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
# src/main/resources/application.properties

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.port=8443

server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
# 비밀번호는 환경변수 KEYSTORE_PASSWORD로 주입 (평문 커밋 금지).
# 실행 전: set KEYSTORE_PASSWORD=<비밀번호>  (cmd) 또는 시스템 환경변수 등록
server.ssl.key-store-password=${KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot

# ai-server (FastAPI uvicorn) endpoint
ai.server.base-url=http://127.0.0.1:8000
# /recommend-and-generate submit timeout (job_id 받기까지)
ai.server.submit-timeout-ms=30000
