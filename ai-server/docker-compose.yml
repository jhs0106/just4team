services:
  ai-server:
    build: .
    container_name: deskterior-ai
    ports:
      - "8000:8000"
    volumes:
      # HuggingFace 모델 캐시 — 최초 1회만 다운로드, 이후 재사용
      - huggingface_cache:/root/.cache/huggingface
      # LoRA 가중치 — 호스트와 컨테이너 공유
      - ./outputs/models:/app/outputs/models
      # 테스트 데이터/상품 이미지
      - ./data:/app/data
      # api 코드 — git pull 후 restart만으로 반영 (rebuild 불필요)
      - ./api:/app/api
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    restart: unless-stopped

volumes:
  # 이름 있는 볼륨 — Docker가 관리, 컨테이너 삭제해도 모델 캐시 유지
  huggingface_cache:
